# xterm-256color for Cursor agent CLI theme/capability probes over SSH.
# (default 'linux' caused escape-sequence spam; tmux-256color terminfo absent on Unraid)
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-size 100x50
set -g mouse on
set -g history-limit 100000
set-option -s set-clipboard on

# Better navigation (CRITICAL)
setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast splitting
bind | split-window -h
bind - split-window -v

setw -g automatic-rename off
setw -g allow-rename off

bind f resize-pane -Z

# Make it visually usable on big screens
set -g status on
set -g status-interval 2

set -g status-left-length 60
set -g status-right-length 120

# LEFT: cockpit identity + session
set -g status-left " cockpit :: #S "

# RIGHT: live system HUD
id="final_clean"
set -g status-right "\
CPU: #(uptime | awk -F'load average:' '{print $2}' | cut -d',' -f1) | \
RAM: #(free | awk '/Mem:/ {printf \"%.0f%%\", $3/$2*100}') | \
Disk: #(df /mnt/user | awk 'NR==2 {print $5}') | \
Docker: #(docker ps -q | wc -l)/#(docker ps -aq | wc -l) | \
Up: #(uptime -p | sed 's/up //')"
# backup test Wed Jun 10 08:44:54 BST 2026
